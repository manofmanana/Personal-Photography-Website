<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <meta name="description" content="Photography and writing by Alejandro Ines: nature, portraits, candids, and experiments.">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">

  <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "theme-light" && theme !== "theme-dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "theme-light" : "theme-dark";
      }
      document.documentElement.classList.add(theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-gradient shadow-sm">
  <a class="navbar-brand font-logo" href="{{ url_for('index') }}">Alejandro Ines</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain"
          aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div id="navMain" class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item {% if request.endpoint=='gallery' %}active{% endif %}">
        <a class="nav-link" href="{{ url_for('gallery') }}">Gallery</a>
      </li>
      <li class="nav-item {% if request.endpoint=='blog' %}active{% endif %}">
        <a class="nav-link" href="{{ url_for('blog') }}">Blog</a>
      </li>
      <li class="nav-item {% if request.endpoint=='about' %}active{% endif %}">
        <a class="nav-link" href="{{ url_for('about') }}">About</a>
      </li>
      <li class="nav-item {% if request.endpoint=='contact' %}active{% endif %}">
        <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
      </li>
    </ul>

    <!-- Tools -->
    <div class="navbar-tools d-flex align-items-center">
      <form class="form-inline my-2 my-md-0 mr-md-2 flex-nowrap" action="{{ url_for('search') }}" method="get" role="search">
        <input id="siteSearch" name="q" class="form-control form-control-sm mr-2" type="search"
               placeholder="Search the site" aria-label="Search the site" value="{{ request.args.get('q', '') if request.endpoint == 'search' }}">
        <button id="searchBtn" class="btn btn-outline-light btn-sm" type="submit">Go</button>
      </form>
      <button id="toggleTheme" class="btn btn-copper btn-sm" type="button" aria-label="Switch between light and dark theme">Theme</button>
    </div>
  </div>
</nav>

{% with msgs = get_flashed_messages(with_categories=True) %}
{% if msgs %}
<div class="container mt-3">
  {% for category, msg in msgs %}
  <div class="alert alert-{{ category if category in ('success', 'warning', 'danger') else 'info' }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}

{% block body %}{% endblock %}

<footer class="site-footer">
  <div class="container text-center">
    <small class="footer-text">&copy; <span id="year"></span> Alejandro Ines — All rights reserved.</small>
  </div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
